<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ぽっちゃん掲示板</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #6b3f1d;
  color: #ffff66;
  font-family: "MS PGothic", "Osaka", sans-serif;
}

.board-wrap {
  max-width: 720px;
  margin: 0 auto;
  border: 4px double #ffff66;
  background: #3b1f0f;
  padding: 16px;
}

h1 {
  text-align: center;
  color: #ffff00;
  text-shadow: 2px 2px 0 #000;
}

.form-box {
  border: 2px solid #ffff66;
  padding: 12px;
  margin-bottom: 20px;
  background: #4b2a14;
}

input,
textarea {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 10px;
  padding: 8px;
  font-size: 16px;
  background: #fff8cc;
  border: 2px inset #999;
}

textarea {
  height: 90px;
}

button {
  width: 100%;
  padding: 10px;
  font-size: 18px;
  font-weight: bold;
  background: #ffff66;
  color: #3b1f0f;
  border: 3px outset #fff;
}

.post {
  border: 2px dashed #ffff66;
  padding: 12px;
  margin-bottom: 16px;
  background: #2a1508;
}

.name {
  color: #ffcc00;
  font-weight: bold;
}

.date {
  font-size: 12px;
  color: #ffef99;
  margin-bottom: 10px;
}

.message {
  white-space: pre-wrap;
  line-height: 1.6;
}

.reply {
  margin-top: 12px;
  padding: 10px;
  background: #4b2a14;
  border-left: 5px solid #ffff66;
  color: #fff0aa;
}

.reply-name {
  font-weight: bold;
  color: #ffffff;
}
</style>
</head>

<body>

<div class="board-wrap">

  <h1>★ ぽっちゃん掲示板 ★</h1>

  <div class="form-box">
    <input type="text" id="nameInput" placeholder="お名前">
    <textarea id="messageInput" placeholder="メッセージを書いてね"></textarea>
    <button onclick="addPost()">送信する</button>
  </div>

  <div id="postArea">

    <div class="post">
      <div class="name">常連さん</div>
      <div class="date">2026/06/03</div>
      <div class="message">ぽっちゃんのページ、なつかしい雰囲気で最高です！</div>
      <div class="reply">
        <div class="reply-name">管理人より</div>
        カキコありがとうございます！ぽっちゃんも喜んでおります♪
      </div>
    </div>

    <div class="post">
      <div class="name">旅人</div>
      <div class="date">2026/06/02</div>
      <div class="message">また遊びに来ます！キリ番ねらいます！</div>
      <div class="reply">
        <div class="reply-name">管理人より</div>
        次回のご訪問もお待ちしております。キリ番ゲットしたら教えてね！
      </div>
    </div>

  </div>

</div>

<script>
function addPost() {
  const nameInput = document.getElementById("nameInput");
  const messageInput = document.getElementById("messageInput");
  const postArea = document.getElementById("postArea");

  const name = nameInput.value.trim() || "ななしさん";
  const message = messageInput.value.trim();

  if (message === "") {
    alert("メッセージを書いてね！");
    return;
  }

  const replies = [
    "カキコありがとうございます！また遊びに来てくださいね♪",
    "ぽっちゃんも喜んでおります！ワン！",
    "ご訪問ありがとうございます。あなたの書き込み、しかと受け取りました！",
    "うれしいメッセージありがとうございます！管理人、感激です。",
    "またのお越しをお待ちしております。キリ番もぜひ狙ってください！"
  ];

  const randomReply = replies[Math.floor(Math.random() * replies.length)];

  const today = new Date();
  const dateText =
    today.getFullYear() + "/" +
    String(today.getMonth() + 1).padStart(2, "0") + "/" +
    String(today.getDate()).padStart(2, "0");

  const post = document.createElement("div");
  post.className = "post";

  post.innerHTML = `
    <div class="name">${escapeHtml(name)}</div>
    <div class="date">${dateText}</div>
    <div class="message">${escapeHtml(message)}</div>
    <div class="reply">
      <div class="reply-name">管理人より</div>
      ${randomReply}
    </div>
  `;

  postArea.prepend(post);

  nameInput.value = "";
  messageInput.value = "";
}

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
